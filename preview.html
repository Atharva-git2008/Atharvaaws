<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Feedback Form</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3efff;
    color: #29243b;
    padding: 35px 15px;
}

.container {
    max-width: 680px;
    margin: auto;
}

.header {
    background: linear-gradient(135deg, #673ab7, #9575cd);
    color: white;
    padding: 35px 30px;
    border-radius: 14px 14px 0 0;
    border-top: 9px solid #512da8;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 12px;
}

.header p {
    font-size: 14px;
    line-height: 1.6;
    opacity: 0.95;
}

.form-card {
    background: white;
    padding: 28px;
    margin-top: 16px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(40, 25, 80, 0.06);
    border: 1px solid #e8e1f5;
}

.question {
    margin-bottom: 28px;
}

.question label.title {
    display: block;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 15px;
}

.required {
    color: #d32f2f;
}

input[type="text"],
input[type="email"],
textarea,
select {
    width: 100%;
    border: none;
    border-bottom: 2px solid #ddd;
    padding: 12px 5px;
    font-size: 15px;
    outline: none;
    background: transparent;
    transition: 0.3s;
}

input:focus,
textarea:focus,
select:focus {
    border-bottom: 2px solid #673ab7;
}

textarea {
    resize: vertical;
    min-height: 80px;
}

.option {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 14px 0;
    font-size: 14px;
    cursor: pointer;
}

input[type="radio"],
input[type="checkbox"] {
    accent-color: #673ab7;
    width: 17px;
    height: 17px;
    cursor: pointer;
}

button {
    background: #673ab7;
    color: white;
    padding: 13px 30px;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #512da8;
    transform: translateY(-2px);
}

.reset {
    background: transparent;
    color: #673ab7;
    margin-left: 12px;
}

.reset:hover {
    background: #f3efff;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
}

.note {
    color: #777;
    font-size: 12px;
    margin-top: 20px;
    text-align: center;
}

.success {
    display: none;
    text-align: center;
    padding: 35px 20px;
    background: #fff;
    border-radius: 12px;
    margin-top: 18px;
}

.success h2 {
    color: #673ab7;
    margin-bottom: 10px;
}

.success p {
    color: #666;
    line-height: 1.6;
}

@media(max-width: 480px) {
    .header {
        padding: 25px 20px;
    }

    .header h1 {
        font-size: 23px;
    }

    .form-card {
        padding: 22px 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Student Feedback Form</h1>
        <p>
            We value your feedback! Please take a few minutes
            to share your experience with us.
        </p>
    </div>

    <form id="feedbackForm">

        <div class="form-card">
            <div class="question">
                <label class="title">
                    Full Name <span class="required">*</span>
                </label>
                <input type="text" id="name"
                    placeholder="Enter your full name" required>
            </div>

            <div class="question">
                <label class="title">
                    Email Address <span class="required">*</span>
                </label>
                <input type="email" id="email"
                    placeholder="Enter your email" required>
            </div>

            <div class="question">
                <label class="title">
                    Which year are you currently studying?
                    <span class="required">*</span>
                </label>

                <select id="year" required>
                    <option value="">Select your year</option>
                    <option>First Year</option>
                    <option>Second Year</option>
                    <option>Third Year</option>
                    <option>Fourth Year</option>
                </select>
            </div>
        </div>

        <div class="form-card">
            <div class="question">
                <label class="title">
                    How would you rate your overall experience?
                    <span class="required">*</span>
                </label>

                <label class="option">
                    <input type="radio" name="rating"
                        value="Excellent" required>
                    Excellent
                </label>

                <label class="option">
                    <input type="radio" name="rating"
                        value="Good">
                    Good
                </label>

                <label class="option">
                    <input type="radio" name="rating"
                        value="Average">
                    Average
                </label>

                <label class="option">
                    <input type="radio" name="rating"
                        value="Poor">
                    Poor
                </label>
            </div>

            <div class="question">
                <label class="title">
                    Which areas would you like to improve?
                </label>

                <label class="option">
                    <input type="checkbox" name="improve"
                        value="Teaching">
                    Teaching Quality
                </label>

                <label class="option">
                    <input type="checkbox" name="improve"
                        value="Infrastructure">
                    Infrastructure
                </label>

                <label class="option">
                    <input type="checkbox" name="improve"
                        value="Events">
                    Events and Activities
                </label>

                <label class="option">
                    <input type="checkbox" name="improve"
                        value="Technology">
                    Technology and Resources
                </label>
            </div>
        </div>

        <div class="form-card">
            <div class="question">
                <label class="title">
                    Any additional suggestions?
                </label>

                <textarea id="suggestions"
                    placeholder="Write your suggestions here..."></textarea>
            </div>

            <div class="footer">
                <button type="submit">Submit Form →</button>
                <button type="reset" class="reset">
                    Clear Form
                </button>
            </div>

            <p class="note">
                Your feedback helps us improve.
                Thank you for participating!
            </p>
        </div>

    </form>

    <div class="success" id="successMessage">
        <h2>✓ Response Submitted!</h2>
        <p>
            Thank you for sharing your feedback.
            Your response has been received in this demo.
        </p>
        <br>
        <button onclick="location.reload()">
            Submit Another Response
        </button>
    </div>

</div>

<script>
const form = document.getElementById("feedbackForm");
const successMessage = document.getElementById("successMessage");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const year = document.getElementById("year").value;

    const rating = document.querySelector(
        'input[name="rating"]:checked'
    );

    const improvements = document.querySelectorAll(
        'input[name="improve"]:checked'
    );

    const suggestions = document.getElementById(
        "suggestions"
    ).value.trim();

    const selectedAreas = Array.from(improvements).map(
        item => item.value
    );

    const response = {
        name: name,
        email: email,
        year: year,
        rating: rating.value,
        improvements: selectedAreas,
        suggestions: suggestions
    };

    console.log("Form Response:", response);

    form.style.display = "none";
    successMessage.style.display = "block";

});

form.addEventListener("reset", function() {
    console.log("Form cleared!");
});
</script>

</body>
</html>
